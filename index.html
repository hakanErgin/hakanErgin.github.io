<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TapLens</title>
<meta name="description" content="TapLens is an Android overlay translator: tap to translate text on any screen.">
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1a1a1a; --muted: #5f6368; --link: #1a56db; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #e8eaed; --muted: #9aa0a6; --link: #8ab4f8; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 36rem; margin: 0 auto; padding: 4rem 1rem; }
  h1 { margin: 0 0 .5rem; font-size: 2rem; }
  p { margin: 0 0 1rem; }
  .muted { color: var(--muted); }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>TapLens</h1>
  <p>An Android overlay translator. Tap the floating button while using any app, and TapLens translates the text on your screen in place.</p>
  <p><a href="/taplens-privacy/">Privacy policy</a></p>
  <p class="muted">Contact: <a href="mailto:hakan.ergin@gmail.com">hakan.ergin@gmail.com</a></p>
</main>
</body>
</html>
